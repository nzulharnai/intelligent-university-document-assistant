<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniDocs Assistant</title>
    <script>
      // Apply a saved dark theme before the first paint to avoid a light flash; light is the default.
      // Keep in sync with ThemeContext.
      try {
        document.documentElement.classList.toggle('dark', localStorage.getItem('theme') === 'dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
