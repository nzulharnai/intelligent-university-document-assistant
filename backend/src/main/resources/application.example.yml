# Template for application.yml (which is git-ignored): copy it next to this file as application.yml.
# Every secret is read from an environment variable or from backend/.env (see backend/.env.example);
# the values after ":" are local-development placeholders only.

server:
  port: 8080

spring:
  application:
    name: doc-assistant
  config:
    # Optional KEY=VALUE file in the working directory (backend/.env when started from backend/), e.g. AI_API_KEY=gsk_...
    # Real environment variables take precedence over it.
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/doc_assistant_db}
    username: ${DB_USERNAME:postgres}
    # Matches POSTGRES_PASSWORD in docker-compose.yml; set DB_PASSWORD for any other database.
    password: ${DB_PASSWORD:postgres_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    web:
      pageable:
        # Caps ?size= so a single request cannot pull a whole table.
        default-page-size: 20
        max-page-size: 100

  servlet:
    multipart:
      # One part may be a ZIP archive (up to 50 MB); every document in it, and every file uploaded on its own, is
      # still limited to 20 MB by DocumentService. A multi-file upload sends several parts in one request.
      max-file-size: ${MAX_UPLOAD_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:100MB}

  # Gmail / Google Workspace SMTP. The password is a Google App Password (spaces removed).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-account@example.com}
    password: ${MAIL_PASSWORD:your-google-app-password}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: "*"
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

app:
  # Deadlines, submission times and reminders are local date-times of this zone (shared Clock, ClockConfig).
  time-zone: ${APP_TIME_ZONE:Asia/Almaty}
  notifications:
    # Deadline reminders (DEADLINE_REMINDER_24H): Spring cron with seconds, in app.time-zone; "-" turns them off.
    # For a demo use e.g. "0 * * * * *" (every minute), or POST /api/v1/admin/notifications/run-reminders as ADMIN.
    reminder-cron: ${REMINDER_CRON:0 */15 * * * *}
    # How far ahead a deadline counts as "soon".
    reminder-hours: ${REMINDER_HOURS:24}
  jwt:
    # Base64-encoded, at least 256 bits for HS256. Generate your own: openssl rand -base64 32
    # The placeholder below is valid only so the app starts locally; never use it in production.
    secret: ${JWT_SECRET:bG9jYWwtZGV2LW9ubHktand0LXNlY3JldC1yZXBsYWNlLW1lLWluLXByb2QhIQ==}
    expiration-ms: 86400000
  otp:
    expiration-minutes: 10
    max-attempts: 5
    resend-cooldown-seconds: 60
  security:
    # Login brute-force limits key on the client IP. Only behind a reverse proxy that sets X-Forwarded-For may
    # this be true; otherwise clients could fake their IP and dodge the limit. Default: the TCP peer address.
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  oauth2:
    google:
      # Google sign-in ("Войти через Google"): the Web application OAuth client from Google Cloud Console.
      # Empty or a placeholder = password login only, one WARN at startup and no Google button on the login page.
      # The client ID must end with .apps.googleusercontent.com. Never commit the secret: set both in backend/.env.
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    # Gmail only delivers mail "from" the authenticated account, so keep it equal to spring.mail.username.
    from: ${MAIL_FROM:your-account@example.com}
    from-name: UniDocs Assistant
  storage:
    # Where uploaded files live: "local" (default, a folder on this server) or "s3" (AWS S3 or MinIO).
    # Switching drivers does not move existing files; copy them first (keys are the stored file names).
    driver: ${STORAGE_DRIVER:local}
    # local: relative paths resolve against the backend's working directory. Never commit this folder.
    upload-dir: ${UPLOAD_DIR:uploads}
    # US-03, local driver: files (documents and task submissions) are encrypted at rest with AES-256-GCM.
    encryption:
      # Empty = on exactly when a key is set; true without a key, or an invalid key, stops the startup.
      enabled: ${STORAGE_ENCRYPTION_ENABLED:}
      # Base64 of 32 random bytes. Set it in backend/.env, never here. Generate one in PowerShell:
      #   $b = New-Object byte[] 32; [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($b); [Convert]::ToBase64String($b)
      # (or: openssl rand -base64 32). Keep a backup: files written with a key cannot be read without it, and
      # changing the key is not supported. Older plain files stay readable and are encrypted at the next start.
      key: ${STORAGE_ENCRYPTION_KEY:}
    # s3: credentials come from the AWS default chain - AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY as real environment
    # variables (backend/.env is not read by the AWS SDK), ~/.aws/credentials, or an instance/container role.
    # Never put keys in this file.
    s3:
      bucket: ${S3_BUCKET:}
      region: ${S3_REGION:eu-central-1}
      # Only for S3-compatible servers, e.g. MinIO: http://localhost:9000 (leave empty for AWS).
      endpoint: ${S3_ENDPOINT:}
      # MinIO needs path-style URLs (http://host/bucket/key); AWS works with the default false.
      path-style-access: ${S3_PATH_STYLE_ACCESS:false}
      # US-03: server-side encryption of every object: AES256 (SSE-S3) or none (only for servers without SSE).
      sse: ${S3_SSE:AES256}
  ocr:
    # US-07: text recognition for scanned PDFs and images with Tesseract (needs rus, kaz, eng language packs).
    # Runs only in the background job after an upload, never in the upload request. A PDF or image with less than
    # 100 characters of text is recognized; if that fails, the document is kept and marked "Нужна проверка".
    enabled: ${OCR_ENABLED:false}
    # Folder of the tesseract executable (or the executable itself), e.g. C:/Program Files/Tesseract-OCR; empty = PATH
    tesseract-path: ${OCR_TESSERACT_PATH:}
    languages: ${OCR_LANGUAGES:rus+kaz+eng}
    # Longest recognition of one document (also the limit of each Tesseract run)
    timeout: ${OCR_TIMEOUT:120s}
    # Only the first pages of a longer PDF are recognized
    max-pages: ${OCR_MAX_PAGES:20}
  privacy:
    # US-09: personal data (IIN, Kazakh phone numbers, e-mails, ID card / passport numbers) is masked in a copy of every
    # document's text; the AI, Q&A, snippets and search only ever see that copy. The original stays for the teacher.
    # false = no masking (the copy equals the text). Changing either setting re-masks old documents at startup.
    enabled: ${PRIVACY_ENABLED:true}
    # E-mails on these domains (and subdomains) are not personal and stay readable, e.g. sdu.edu.kz,university.kz
    public-email-domains: ${PRIVACY_PUBLIC_EMAIL_DOMAINS:}
  ai:
    # Classification (US-05), deadline extraction and Q&A through an OpenAI-compatible Chat Completions API.
    # Default: Groq with openai/gpt-oss-120b; OpenAI, DeepSeek, OpenRouter... work by changing the two lines below.
    # The key comes from AI_API_KEY, else OPENAI_API_KEY (environment or backend/.env, see .env.example).
    # With AI_ENABLED=false or the demo key nothing is sent and uploads work as usual, just without AI.
    enabled: ${AI_ENABLED:true}
    api-key: ${AI_API_KEY:${OPENAI_API_KEY:demo-key}}
    model: ${AI_MODEL:openai/gpt-oss-120b}
    base-url: ${AI_BASE_URL:https://api.groq.com/openai/v1}
    connect-timeout: 10s
    read-timeout: ${AI_READ_TIMEOUT:90s}
    # Longest text of one deadline-extraction call (~5k tokens). Groq's free tier allows about 8000 tokens PER MINUTE
    # for openai/gpt-oss-120b, so a bigger call can never succeed, whatever the retries. Longer documents are sent in
    # chunks of this size, one after another. Raise it on a paid plan or another provider.
    max-input-chars: ${AI_MAX_INPUT_CHARS:15000}
    # Background AI jobs (classification, deadline extraction) running at once. Groq's free tier allows only a few
    # requests and tokens per minute, so a ZIP of many files at 4+ in parallel quickly hits 429; 2 keeps a batch
    # moving without tripping the limit. Raise it on a paid plan or another provider.
    max-concurrency: ${AI_MAX_CONCURRENCY:2}
    queue-capacity: ${AI_QUEUE_CAPACITY:200}
    # Q&A answers synchronously; questions beyond this many in flight get 503 instead of piling up.
    max-concurrent-questions: ${AI_MAX_CONCURRENT_QUESTIONS:20}
    # Tries per AI call, the first one included, when the API answers 429 (rate limit) or 5xx. Waits for Retry-After
    # (at most 20 s) or else 2 s, 4 s, ... Other errors and timeouts are never retried. Missing or < 1 means 3.
    max-attempts: ${AI_MAX_ATTEMPTS:3}
    # Assignments and deadlines the AI finds in a document start as drafts: the course teacher reviews and publishes
    # them (course page, "Черновики от ИИ") before students see them or get tasks. true = publish at once, as before.
    auto-publish-assignments: ${AI_AUTO_PUBLISH_ASSIGNMENTS:false}
